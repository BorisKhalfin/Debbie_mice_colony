services:
  streamlit_app:
    build: .
    container_name: streamlit_mice_app
    restart: always
    expose:
      - "8501"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - streamlit_app
